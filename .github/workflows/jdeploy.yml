name: jDeploy CI with Maven

on:
  push:
    branches: ['*']
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Deploy with jDeploy
        uses: shannah/jdeploy@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Note: This step is unusual for a CI build (running a GUI app in a headless runner), 
      # but I've kept it here as a separate step per your original logic.
      - name: Verify Compilation
        run: javac src/main/java/com/github/aqwertyuiop48/testswing11/TestSwing11.java
